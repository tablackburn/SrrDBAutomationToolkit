name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer Lint
    runs-on: ubuntu-latest
    # Guard against a hung step burning the 6-hour default. Lint normally
    # finishes in well under a minute.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No authenticated git commands run in this job.
          persist-credentials: false

      - name: Install dependencies
        shell: pwsh
        run: ./build.ps1 -Bootstrap -Task Init

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./build.ps1 -Task Analyze

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Guard against a hung step burning the 6-hour default. The specific hazard
    # this catches: BuildHelpers' Invoke-Git calls WaitForExit() before draining
    # standard output, so on Windows a HEAD commit message larger than the
    # 4096-byte pipe buffer deadlocks the build with no output at all. Keep
    # merge-commit messages short.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No authenticated git commands run in this job.
          persist-credentials: false

      # No module cache here on purpose, and no separate PSDepend bootstrap.
      #
      # Measured on a sibling repository, same tree: ubuntu 27 seconds warm and
      # 27 cold, macOS 16 and 26, Windows 28 and 50. The three jobs run in
      # parallel, so the cache bought at most about 22 seconds of wall-clock.
      # Against that it made pull-request runs warm and main runs cold, so a
      # pull request could pass on a code path main never exercised.
      #
      # This also removes potatoqualitee/psmodulecache, which installed to the
      # AllUsers path while build.depend.psd1 targets CurrentUser -- two copies
      # of the binary Pester assembly on one machine, which Pester 6 cannot
      # load. The steps that installed PSDepend and enumerated dependencies for
      # that cache are gone too: build.ps1 -Bootstrap installs PSDepend itself
      # and gates installation on Invoke-PSDepend -Test, so a runner that
      # already satisfies the dependency file does no installation work.
      - name: Run tests
        shell: pwsh
        run: ./build.ps1 -Bootstrap -Task Test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: out/codeCoverage.xml
          flags: ${{ matrix.os }}
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: out/
          retention-days: 30
